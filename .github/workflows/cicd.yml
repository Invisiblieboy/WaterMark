name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

env:
  SOURCES: main.cpp ArgumentParser.cpp ../BMPImage/BMPImage.cpp Watermark.cpp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: clang++ -std=c++17 -Wall -Wextra -o "watermark" $SOURCES

      - name: Build (san)
        run: >
          clang++ -std=c++17 -Wall -Wextra -g -O0
          -fsanitize=address,undefined
          -o "watermark_debug" $SOURCES